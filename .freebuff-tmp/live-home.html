<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Icons. Google uses the favicon as the logo shown beside search results,
         so every size it might pick is declared explicitly (and /favicon.ico
         stays a real file at the root, which Google also checks). The
         maskable variant is what Android/Chrome use for home-screen installs.
         These are the real brand tile, generated by
         .freebuff/build-brand-assets.cjs — no SVG placeholder, because the logo
         is supplied as artwork rather than as vectors. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Default robots directives for the canonical host. Two documents are
         derived from this shell, and the prerender plugin gives each its own
         value: "/" (dist/index.html, with the canonical and og:url above left
         out on purpose) keeps this indexable directive, and the SPA fallback —
         the document served for every URL that has no prerendered file of its
         own, see frontend/src/lib/spaRoutes.ts — ships `noindex` instead. That
         second document used to be this one, so every unclassified URL reached
         a crawler as an indexable copy of the homepage.
         Without an explicit directive Google picks its own snippet/image limits,
         and a stale title ("Login – Vercel" at one point) survives recrawls. -->

    <!-- Brand fonts: display serif + UI sans + tabular mono for marks and timers.
         Loaded as a plain stylesheet link (in parallel with the app CSS) rather
         than a CSS @import, which serialized behind the bundle and delayed
         first paint on every visit. display=swap keeps text visible while the
         faces load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap" />
    <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFDF9" media="(prefers-color-scheme: light)" />

    <!-- VITE_PLAUSIBLE_DOMAIN_PLACEHOLDER: replaced at build time with the
         Plausible script tag when VITE_PLAUSIBLE_DOMAIN is set (see
         plugins inject). Keeps local dev and previews script-free. -->
    <script>(function(){try{if(localStorage.getItem("cm-analytics-optout")==="1")return}catch(e){}var s=document.createElement("script");s.defer=true;s.setAttribute("data-domain","clutchmarks.study");s.src="https://plausible.io/js/script.tagged-events.js";document.head.appendChild(s);})();</script>

    <meta name="author" content="Clutch Marks" />
    <meta name="google-site-verification" content="m5Qj2P9Rv04eQ1Q05i5zYUceYinJWgsDtaHJgVjYv80" />

    <!-- No and no og:url here on purpose.

         This file is the shell the static host serves for every URL that has no
         prerendered file of its own — a 404, a /study/... path, any future route
         — so a canonical pointing at "/" told Google that all of them were
         copies of the homepage. That is a URL-consolidation signal: it is how a
         whole content library gets quietly folded into one page.

         The prerender plugin writes the correct canonical/og:url into each
         route's own HTML (see plugins/prerender-seo.ts), and <SEOHead /> sets
         them at runtime per page. A missing canonical is harmless; a wrong one
         is not. Keep this file free of both. -->
    <!-- No og:url deliberately — see the note above: it is replaced per route. -->
    <script type="module" crossorigin src="/assets/index-DAYiDn7P.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/react-cHh4uot5.js">
    <link rel="modulepreload" crossorigin href="/assets/ui-BfvFxHuq.js">
    <link rel="modulepreload" crossorigin href="/assets/supabase-DoaBfBsZ.js">
    <link rel="stylesheet" crossorigin href="/assets/index-95znhAjm.css">
    <title>Clutch Marks — Revision Notes, Topic Questions &amp; Past Papers</title>
    <meta data-seo="prerender" name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta data-seo="prerender" name="description" content="Revision notes, exam-style topic questions with instant marking, and past papers with mark schemes for Maths, Physics and Computer Science at IGCSE, AS and A2." />
    <link data-seo="prerender" rel="canonical" href="https://clutchmarks.study/" />

    <meta data-seo="prerender" property="og:type" content="website" />

    <meta data-seo="prerender" property="og:description" content="Revision notes, exam-style topic questions with instant marking, and past papers with mark schemes for Maths, Physics and Computer Science at IGCSE, AS and A2." />
    <meta data-seo="prerender" property="og:url" content="https://clutchmarks.study/" />
