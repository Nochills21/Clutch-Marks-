<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Icons. Google uses the favicon as the logo shown beside search results,
         so every size it might pick is declared explicitly (and /favicon.ico
         stays a real file at the root, which Google also checks). The
         maskable variant is what Android/Chrome use for home-screen installs.
         These are the real brand tile, generated by
         .freebuff/build-brand-assets.cjs — no SVG placeholder, because the logo
         is supplied as artwork rather than as vectors. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Title and description must equal ROUTE_META "/" in
         frontend/src/lib/seoRoutes.ts: the prerenderer rewrites them per route,
         but this file is what a crawler gets from any host that serves the shell
         as-is, and seoConsistency.test.ts compares the two. They used to say
         "Maths, Physics & Computer Science Revision" — the site's first three
         subjects — months after Chemistry, Biology and English had pages. The
         subject list is generated (frontend/src/lib/subjectCatalogue.ts), so when
         a new subject ships, this line is the one thing still to update by hand. -->
    <title>Clutch Marks — Revision Material, Topic Questions &amp; Past Papers</title>
    <meta name="description" content="Revision material, questions, flashcards, an AI marker, a study planner and a past-paper archive for Maths, Physics, Chemistry, Biology and Computer Science at IGCSE, AS and A2, and English at IGCSE." />

    <!-- Default robots directives for the canonical host. Two documents are
         derived from this shell, and the prerender plugin gives each its own
         value: "/" (dist/index.html, with the canonical and og:url above left
         out on purpose) keeps this indexable directive, and the SPA fallback —
         the document served for every URL that has no prerendered file of its
         own, see frontend/src/lib/spaRoutes.ts — ships `noindex` instead. That
         second document used to be this one, so every unclassified URL reached
         a crawler as an indexable copy of the homepage.
         Without an explicit directive Google picks its own snippet/image limits,
         and a stale title ("Login – Vercel" at one point) survives recrawls. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Brand fonts: display serif + UI sans + tabular mono for marks and timers.
         Self-hosted (scripts/fetch-fonts.cjs writes public/fonts/*.woff2 and
         src/fonts.css): the old <link> to fonts.googleapis.com was a
         render-blocking third-party stylesheet — HTML → googleapis CSS →
         gstatic woff2 — before first paint on every page. The @font-face rules
         ship inside this bundle's CSS, and the two preloads below start the
         body/display faces downloading in parallel with the HTML itself.
         font-display: swap keeps text visible while they load. -->
    <!-- One variable file per family (scripts/fetch-fonts.cjs): Google serves the
         same woff2 for every weight, so the per-weight copies were the identical
         bytes behind different URLs — four Fraunces and five Inter downloads on a
         page that used two weights. These two are the ones first paint needs; the
         mono face loads when a mark or timer actually renders. -->
    <link rel="preload" href="/fonts/fraunces-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFDF9" media="(prefers-color-scheme: light)" />

    <!-- VITE_PLAUSIBLE_DOMAIN_PLACEHOLDER: replaced at build time with the
         Plausible script tag when VITE_PLAUSIBLE_DOMAIN is set (see
         plugins inject). Keeps local dev and previews script-free. -->
    <!--analytics-inject-->

    <meta name="author" content="Clutch Marks" />
    <meta name="google-site-verification" content="m5Qj2P9Rv04eQ1Q05i5zYUceYinJWgsDtaHJgVjYv80" />

    <!-- No <link rel="canonical"> and no og:url here on purpose.

         This file is the shell the static host serves for every URL that has no
         prerendered file of its own — a 404, a /study/... path, any future route
         — so a canonical pointing at "/" told Google that all of them were
         copies of the homepage. That is a URL-consolidation signal: it is how a
         whole content library gets quietly folded into one page.

         The prerender plugin writes the correct canonical/og:url into each
         route's own HTML (see plugins/prerender-seo.ts), and <SEOHead /> sets
         them at runtime per page. A missing canonical is harmless; a wrong one
         is not. Keep this file free of both. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clutch Marks" />
    <meta property="og:title" content="Clutch Marks — Revision Material, Topic Questions &amp; Past Papers" />
    <meta property="og:description" content="Revision material, questions, flashcards, an AI marker, a study planner and a past-paper archive for Maths, Physics, Chemistry, Biology and Computer Science at IGCSE, AS and A2, and English at IGCSE." />
    <!-- No og:url deliberately — see the note above: it is replaced per route. -->
    <meta property="og:image" content="https://clutchmarks.study/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clutch Marks — revision material, topic questions and past papers" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clutch Marks — Revision Material, Topic Questions &amp; Past Papers" />
    <meta name="twitter:description" content="Revision material, questions, flashcards, an AI marker, a study planner and a past-paper archive for Maths, Physics, Chemistry, Biology and Computer Science at IGCSE, AS and A2, and English at IGCSE." />
    <meta name="twitter:image" content="https://clutchmarks.study/og.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
