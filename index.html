<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Icons. Google uses the favicon as the logo shown beside search results,
         so every size it might pick is declared explicitly (and /favicon.ico
         stays a real file at the root, which Google also checks). The
         maskable variant is what Android/Chrome use for home-screen installs.
         These are the real brand tile, generated by
         .freebuff/build-brand-assets.cjs — no SVG placeholder, because the logo
         is supplied as artwork rather than as vectors. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Clutch Marks — Maths, Physics &amp; Computer Science Revision</title>
    <meta name="description" content="Revision notes, exam-style topic questions with instant marking, and past papers with mark schemes for Maths, Physics and Computer Science at OL, AS and A2." />

    <!-- Brand fonts: display serif + UI sans + tabular mono for marks and timers. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFDF9" media="(prefers-color-scheme: light)" />

    <!-- VITE_PLAUSIBLE_DOMAIN_PLACEHOLDER: replaced at build time with the
         Plausible script tag when VITE_PLAUSIBLE_DOMAIN is set (see
         plugins inject). Keeps local dev and previews script-free. -->
    <!--analytics-inject-->

    <meta name="author" content="Clutch Marks" />
    <meta name="google-site-verification" content="m5Qj2P9Rv04eQ1Q05i5zYUceYinJWgsDtaHJgVjYv80" />

    <!-- Update og:url + canonical to https://clutchmarks.study when the domain
         is live (see docs/domain-launch-runbook.md). SITE.url in
         src/lib/site.ts drives the in-app equivalents. -->
    <link rel="canonical" href="https://clutchmarks.study/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clutch Marks" />
    <meta property="og:title" content="Clutch Marks — Maths, Physics &amp; Computer Science Revision" />
    <meta property="og:description" content="Revision notes, exam-style topic questions with instant marking, and past papers with mark schemes for IGCSE, AS and A Level." />
    <meta property="og:url" content="https://clutchmarks.study/" />
    <meta property="og:image" content="https://clutchmarks.study/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clutch Marks — revision notes, topic questions and past papers" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clutch Marks — Maths, Physics &amp; Computer Science Revision" />
    <meta name="twitter:description" content="Revision notes, exam-style topic questions with instant marking, and past papers with mark schemes for IGCSE, AS and A Level." />
    <meta name="twitter:image" content="https://clutchmarks.study/og.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
